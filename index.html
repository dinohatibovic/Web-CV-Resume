<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino Hatibovic | Pro Reset</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Space Grotesk', 'sans-serif'] },
                    colors: { brand: { accent: '#00ff9d' } }
                }
            }
        }
    </script>
    <style>
        body { background-color: #050505; color: #e5e5e5; }
    </style>
</head>
<body class="h-screen flex flex-col items-center justify-center text-center">
    
    <div class="p-4 border border-brand-accent/30 rounded-lg bg-white/5 backdrop-blur">
        <p class="text-brand-accent uppercase tracking-widest text-xs mb-2">@SYSTEM STATUS</p>
        <h1 class="text-4xl md:text-6xl font-bold text-white mb-4">TAILWIND IS ACTIVE</h1>
        <p class="text-gray-400">Rendering Engine: <span class="text-brand-accent">ONLINE</span></p>
    </div>

</body>
</html>
