<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino Hatibovic | Portfolio & CV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Space Grotesk', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        brand: {
                            black: '#050505',
                            accent: '#00ff9d',
                            glass: 'rgba(255, 255, 255, 0.05)'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #050505; color: #e5e5e5; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #00ff9d; border-radius: 4px; }
        
        .text-gradient {
            background: linear-gradient(to right, #fff, #00ff9d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .glass-nav {
            background: rgba(5, 5, 5, 0.7);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        /* Animation for Hero */
        .fade-in-up { animation: fadeInUp 0.8s ease-out forwards; opacity: 0; transform: translateY(20px); }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
    </style>
</head>

<body class="antialiased font-sans bg-brand-black selection:bg-brand-accent selection:text-black">

    <nav class="fixed w-full z-50 py-5 px-6 md:px-12 flex justify-between items-center glass-nav">
        <a href="#" class="text-2xl font-serif font-bold tracking-tighter hover:text-white transition">
            DINO<span class="text-brand-accent">.DEV</span>
        </a>
        
        <div class="hidden md:flex space-x-8 text-xs uppercase tracking-[0.2em] font-medium text-gray-400">
            <a href="#about" class="hover:text-brand-accent transition-colors duration-300">About</a>
            <a href="#experience" class="hover:text-brand-accent transition-colors duration-300">Experience</a>
            <a href="#skills" class="hover:text-brand-accent transition-colors duration-300">Skills</a>
            <a href="#projects" class="hover:text-brand-accent transition-colors duration-300">Showcase</a>
        </div>

        <div class="md:hidden text-brand-accent text-xl">
            <i class="fa-solid fa-bars"></i>
        </div>
    </nav>

    <header class="relative h-screen flex items-center justify-center overflow-hidden border-b border-white/5">
        <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-brand-accent/10 rounded-full blur-[120px] pointer-events-none"></div>
        
        <div class="relative z-10 text-center px-4 max-w-4xl mx-auto">
            <p class="text-brand-accent uppercase tracking-[0.4em] text-xs md:text-sm mb-6 fade-in-up" style="animation-delay: 0.1s;">
                // Cloud • AI • Full Stack //
            </p>
            
            <h1 class="text-5xl md:text-8xl lg:text-9xl font-serif font-bold mb-8 text-gradient fade-in-up" style="animation-delay: 0.2s;">
                Dino Hatibovic
            </h1>
            
            <p class="text-gray-400 text-lg md:text-xl leading-relaxed font-light mb-10 fade-in-up" style="animation-delay: 0.3s;">
                Google Cloud Developer & Full Stack Engineer focused on building 
                <span class="text-white font-medium">scalable</span> digital solutions and 
                <span class="text-brand-accent">AI‑powered systems</span>.
            </p>
            
            <div class="flex flex-col md:flex-row gap-5 justify-center items-center fade-in-up" style="animation-delay: 0.4s;">
                <a href="#contact" class="px-8 py-4 bg-brand-accent text-black font-bold uppercase text-xs tracking-[0.2em] hover:bg-white transition-all duration-300">
                    Contact Me
                </a>
                <button onclick="window.print()" class="px-8 py-4 border border-white/20 text-white hover:border-brand-accent hover:text-brand-accent transition-all duration-300 uppercase text-xs tracking-[0.2em]">
                    <i class="fa-solid fa-download mr-2"></i> Save as PDF
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-24 text-center">
        <p class="text-gray-600 text-sm">
            [ Next Sections: About, Experience & Skills will load here ]
        </p>
    </main>

</body>
</html>
